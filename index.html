<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Omni</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Omni">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#7c3aed">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @property --omni-angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        :root {
            --bg: #f7f7f8;
            --bg-tint: #ede9fe;
            --panel: #ffffff;
            --sidebar-bg: #f0f0f2;
            --border: #e5e5e5;
            --text: #1a1a1a;
            --muted: #8a8a8a;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --danger: #ef4444;
            --user-bg: #7c3aed;
            --user-text: #ffffff;
            --bot-bg: #f1f1f3;
            --bot-text: #1a1a1a;
            --code-bg: #2a2a2a;
            --code-text: #f0f0f0;
            --inline-code-bg: #e5e5e7;
            --icon-hover-bg: rgba(0, 0, 0, 0.06);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --sidebar-width: 260px;
        }

        [data-theme="dark"] {
            --bg: #0e0e10;
            --bg-tint: #16101f;
            --panel: #17171a;
            --sidebar-bg: #131316;
            --border: #26262b;
            --text: #ececec;
            --muted: #8a8a92;
            --accent: #a78bfa;
            --accent-hover: #c4b5fd;
            --user-bg: #7c3aed;
            --user-text: #ffffff;
            --bot-bg: #202024;
            --bot-text: #ececec;
            --code-bg: #0a0a0b;
            --code-text: #f0f0f0;
            --inline-code-bg: #2a2a2f;
            --icon-hover-bg: rgba(255, 255, 255, 0.08);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;

            /* Breathing gradient background */
            background: linear-gradient(var(--omni-angle),
                    var(--bg) 0%,
                    var(--bg-tint) 40%,
                    var(--bg) 80%);
            background-size: 100% 100%;
            animation: omniBgFlow 30s linear infinite;
        }

        @keyframes omniBgFlow {
            to {
                --omni-angle: 360deg;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body {
                animation: none;
            }
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 14px 14px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header .logo-img {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }

        .sidebar-header .sidebar-title {
            font-size: 15px;
            font-weight: 600;
            flex: 1;
            letter-spacing: -0.01em;
        }

        .sidebar-close {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-close:hover {
            background: var(--bot-bg);
            color: var(--text);
        }

        .sidebar-close svg {
            width: 16px;
            height: 16px;
        }

        .sidebar-newchat {
            margin: 12px 12px 6px;
            padding: 10px 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s;
        }

        .sidebar-newchat:hover {
            background: var(--accent-hover);
        }

        .sidebar-newchat svg {
            width: 15px;
            height: 15px;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
        }

        .sidebar-list::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .sidebar-section-label {
            font-size: 11px;
            color: var(--muted);
            padding: 12px 8px 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .conv-item {
            padding: 9px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.1s;
            position: relative;
        }

        .conv-item:hover {
            background: var(--bot-bg);
        }

        .conv-item.active {
            background: var(--bot-bg);
            font-weight: 500;
        }

        .conv-item .conv-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .conv-item .conv-menu {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 0 4px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .conv-item:hover .conv-menu {
            opacity: 1;
        }

        .conv-item .conv-menu:hover {
            color: var(--text);
            background: var(--border);
        }

        .sidebar-empty {
            padding: 16px 12px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
            line-height: 1.5;
        }

        .sidebar-footer {
            border-top: 1px solid var(--border);
            padding: 8px;
        }

        .sidebar-footer .sidebar-item {
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.1s;
        }

        .sidebar-footer .sidebar-item:hover {
            background: var(--bot-bg);
        }

        .sidebar-footer .sidebar-item.danger:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .sidebar-footer svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            color: var(--muted);
        }

        .conv-dropdown {
            position: fixed;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 4px;
            z-index: 200;
            min-width: 130px;
            font-size: 13px;
        }

        .conv-dropdown button {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
        }

        .conv-dropdown button:hover {
            background: var(--bot-bg);
        }

        .conv-dropdown button.danger:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 99;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s, visibility 0.25s;
        }

        .backdrop.show {
            opacity: 1;
            visibility: visible;
        }

        /* ---------- Main app ---------- */
        .app {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            padding: 0 12px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            transition: margin-left 0.25s ease;
            background: transparent;
        }

        body.sidebar-open .app {
            margin-left: var(--sidebar-width);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 10px;
            flex-shrink: 0;
            gap: 8px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            display: block;
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }

        .brand h1 {
            font-size: 17px;
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .brand .tag {
            font-size: 11px;
            color: var(--muted);
            margin-top: 1px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            transition: background 0.2s;
        }

        .status.busy {
            background: #eab308;
            animation: pulse 1.2s infinite;
        }

        .status.error {
            background: #ef4444;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .icon-btn {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            width: 34px;
            height: 34px;
            border-radius: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, border-color 0.15s;
        }

        .icon-btn:hover {
            background: var(--bot-bg);
        }

        .icon-btn svg {
            width: 16px;
            height: 16px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding: 8px 0 16px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .msg-block {
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.25s ease-out;
            max-width: 85%;
            background: transparent;
        }

        .msg-block.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-block.bot {
            align-self: flex-start;
            align-items: flex-start;
            width: 100%;
            max-width: 100%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg {
            line-height: 1.55;
            font-size: 15px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            padding: 11px 15px;
            border-radius: var(--radius);
            max-width: 100%;
            background: transparent;
        }

        .msg.user {
            background: var(--user-bg);
            color: var(--user-text);
            border-bottom-right-radius: 4px;
            white-space: pre-wrap;
            width: fit-content;
            max-width: 100%;
        }

        .msg.bot {
            background: var(--bot-bg);
            color: var(--bot-text);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow);
            width: 100%;
        }

        .actions {
            display: flex;
            gap: 2px;
            margin-top: 6px;
            padding: 0;
            opacity: 1;
            background: transparent;
        }

        .msg-block.user .actions {
            justify-content: flex-end;
            padding-right: 4px;
        }

        .msg-block.bot .actions {
            justify-content: flex-start;
            padding-left: 4px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s, transform 0.1s;
            opacity: 0.75;
        }

        .action-btn:hover {
            background: var(--icon-hover-bg);
            color: var(--text);
            opacity: 1;
        }

        .action-btn:active {
            transform: scale(0.92);
        }

        .action-btn svg {
            width: 15px;
            height: 15px;
            display: block;
        }

        .action-btn.copied {
            color: var(--accent);
            opacity: 1;
        }

        .edit-box {
            width: 100%;
            background: var(--bg);
            color: var(--text);
            border: 1.5px solid var(--accent);
            border-radius: 10px;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            min-height: 42px;
            max-height: 200px;
        }

        .edit-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            justify-content: flex-end;
        }

        .edit-actions button {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-family: inherit;
        }

        .edit-actions .save-btn {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .edit-actions .save-btn:hover {
            background: var(--accent-hover);
        }

        .edit-actions .cancel-btn:hover {
            background: var(--bot-bg);
        }

        .bot p {
            margin: 0 0 10px;
        }

        .bot p:last-child {
            margin-bottom: 0;
        }

        .bot ul,
        .bot ol {
            margin: 6px 0 10px 22px;
            padding: 0;
        }

        .bot li {
            margin: 3px 0;
        }

        .bot code {
            background: var(--inline-code-bg);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.88em;
            font-family: "SF Mono", Consolas, Monaco, monospace;
        }

        .bot pre {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 12px 14px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 10px 0;
            font-size: 13px;
        }

        .bot pre code {
            background: none;
            color: inherit;
            padding: 0;
        }

        .bot h1,
        .bot h2,
        .bot h3 {
            margin: 12px 0 8px;
            font-weight: 600;
            line-height: 1.3;
        }

        .bot h1 {
            font-size: 1.2em;
        }

        .bot h2 {
            font-size: 1.1em;
        }

        .bot h3 {
            font-size: 1em;
        }

        .bot a {
            color: var(--accent);
        }

        .bot blockquote {
            border-left: 3px solid var(--border);
            margin: 8px 0;
            padding: 4px 12px;
            color: var(--muted);
        }

        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            padding: 12px;
            animation: fadeIn 0.4s;
        }

        .logo-lg-img {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            display: block;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .welcome h2 {
            font-size: 20px;
            margin: 0 0 6px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .welcome p {
            color: var(--muted);
            font-size: 13px;
            margin: 0 0 22px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            width: 100%;
            max-width: 460px;
        }

        .suggestion {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
        }

        .suggestion:hover,
        .suggestion:active {
            border-color: var(--accent);
            box-shadow: var(--shadow);
        }

        .suggestion .s-title {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .suggestion .s-desc {
            color: var(--muted);
            font-size: 12px;
        }

        .composer-wrap {
            flex-shrink: 0;
            padding-top: 8px;
        }

        .composer {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 8px 8px 14px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            box-shadow: var(--shadow);
            transition: border-color 0.15s;
            width: 100%;
        }

        .composer:focus-within {
            border-color: var(--accent);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 16px;
            line-height: 1.4;
            resize: none;
            outline: none;
            padding: 8px 0;
            max-height: 140px;
            min-height: 22px;
            width: 100%;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, transform 0.1s;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            background: var(--muted);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .send-btn svg {
            width: 17px;
            height: 17px;
        }

        .send-btn .icon-stop {
            display: none;
        }

        .send-btn.stopping {
            background: var(--danger);
        }

        .send-btn.stopping .icon-send {
            display: none;
        }

        .send-btn.stopping .icon-stop {
            display: block;
        }

        .hint {
            text-align: center;
            font-size: 11px;
            color: var(--muted);
            margin-top: 6px;
            padding-bottom: 2px;
        }

        .hint kbd {
            background: var(--bot-bg);
            padding: 1px 5px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 10px;
        }

        .dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            height: 20px;
        }

        .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.2s infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* ---------- Splash (flat, no gradient) ---------- */
        #splash {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #splash.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .omni-logo {
            width: 110px;
            height: 110px;
            display: block;
            overflow: visible;
        }

        .omni-logo .draw {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
        }

        .omni-logo .draw-main {
            animation: drawPath 1.4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        .omni-logo .draw-curl {
            animation: drawPath 0.7s cubic-bezier(0.65, 0, 0.35, 1) 1.2s forwards;
        }

        @keyframes drawPath {
            to {
                stroke-dashoffset: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .omni-logo .draw {
                stroke-dasharray: none;
                stroke-dashoffset: 0;
                animation: none;
            }
        }

        .splash-name {
            font-size: 26px;
            font-weight: 700;
            margin-top: 20px;
            letter-spacing: -0.02em;
            animation: splashIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 1.6s both;
        }

        .splash-tag {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
            animation: splashIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 1.8s both;
        }

        .splash-dots {
            display: inline-flex;
            gap: 6px;
            margin-top: 32px;
            animation: splashIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 2s both;
        }

        .splash-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: splashBounce 1.2s infinite;
        }

        .splash-dots span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .splash-dots span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes splashIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes splashBounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.3;
            }

            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        @media (min-width: 720px) {
            .app {
                max-width: 780px;
                margin: 0 auto;
                position: relative;
                height: 100vh;
                height: 100dvh;
            }

            body.sidebar-open .app {
                margin-left: calc(50% - 390px + var(--sidebar-width));
                max-width: 780px;
            }

            .suggestions {
                grid-template-columns: 1fr 1fr;
            }

            .welcome h2 {
                font-size: 22px;
            }

            .logo-lg-img {
                width: 72px;
                height: 72px;
            }

            #chat {
                padding: 12px 0 20px;
            }

            textarea {
                font-size: 15px;
            }

            .sidebar-close {
                display: none;
            }
        }

        @media (max-width: 420px) {
            .brand .tag {
                display: none;
            }

            .brand h1 {
                font-size: 16px;
            }

            .msg-block {
                max-width: 92%;
            }
        }
    </style>
</head>

    <script>
        const chat = document.getElementById("chat");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const statusEl = document.getElementById("status");
        const sidebar = document.getElementById("sidebar");
        const backdrop = document.getElementById("backdrop");
        const sidebarList = document.getElementById("sidebarList");
        const currentTitle = document.getElementById("currentTitle");

        let streaming = false;
        let currentController = null;

        /* ============================================================
           LUCIDE ICONS
        ============================================================ */
        const ICONS = {
            copy: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>`,
            pencil: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg>`,
            refresh: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>`,
        };

        function makeBtn({ icon, title, onClick }) {
            const btn = document.createElement("button");
            btn.className = "action-btn";
            btn.title = title;
            btn.setAttribute("aria-label", title);
            btn.innerHTML = ICONS[icon];
            btn.onclick = onClick;
            return btn;
        }

        /* ============================================================
           DATA MODEL
        ============================================================ */
        let conversations = [];
        let currentId = null;

        function genId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        function loadData() {
            const raw = localStorage.getItem("omni_conversations");
            if (raw) {
                try {
                    conversations = JSON.parse(raw);
                    currentId = localStorage.getItem("omni_current_id") || null;
                } catch { conversations = []; }
            }
            const oldHistory = localStorage.getItem("omni_history");
            if (oldHistory) {
                try {
                    const msgs = JSON.parse(oldHistory);
                    if (Array.isArray(msgs) && msgs.length) {
                        const conv = {
                            id: genId(),
                            title: makeTitleFromMessages(msgs),
                            messages: msgs.map(m => ({ role: m.role, text: m.text })),
                            createdAt: Date.now(),
                            updatedAt: Date.now()
                        };
                        conversations.unshift(conv);
                        if (!currentId) currentId = conv.id;
                        saveData();
                    }
                } catch { }
                localStorage.removeItem("omni_history");
            }
            if (!conversations.length) createConversation(false);
            if (!conversations.find(c => c.id === currentId)) currentId = conversations[0].id;
        }

        function saveData() {
            localStorage.setItem("omni_conversations", JSON.stringify(conversations));
            if (currentId) localStorage.setItem("omni_current_id", currentId);
        }

        function getCurrent() {
            return conversations.find(c => c.id === currentId) || null;
        }

        function makeTitleFromMessages(msgs) {
            const firstUser = msgs.find(m => m.role === "user");
            if (!firstUser || !firstUser.text) return "New chat";
            let t = firstUser.text.trim().replace(/\s+/g, " ");
            if (t.length > 40) t = t.slice(0, 40) + "…";
            return t || "New chat";
        }

        function createConversation(makeCurrent = true) {
            const conv = {
                id: genId(),
                title: "New chat",
                messages: [],
                createdAt: Date.now(),
                updatedAt: Date.now()
            };
            conversations.unshift(conv);
            if (makeCurrent) currentId = conv.id;
            saveData();
            return conv;
        }

        function touchCurrent() {
            const c = getCurrent();
            if (!c) return;
            c.updatedAt = Date.now();
            if (c.title === "New chat") c.title = makeTitleFromMessages(c.messages);
            saveData();
        }

        /* ============================================================
           SIDEBAR RENDER
        ============================================================ */
        function groupByDate(list) {
            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const startOfYesterday = startOfToday - 86400000;
            const sevenDaysAgo = startOfToday - 7 * 86400000;
            const groups = { Today: [], Yesterday: [], "Previous 7 days": [], Older: [] };
            for (const c of list) {
                const t = c.updatedAt || c.createdAt || 0;
                if (t >= startOfToday) groups.Today.push(c);
                else if (t >= startOfYesterday) groups.Yesterday.push(c);
                else if (t >= sevenDaysAgo) groups["Previous 7 days"].push(c);
                else groups.Older.push(c);
            }
            return groups;
        }

        function renderSidebar() {
            sidebarList.innerHTML = "";
            if (!conversations.length) {
                sidebarList.innerHTML = '<div class="sidebar-empty">No conversations yet.<br>Start a new chat to begin.</div>';
                return;
            }
            const sorted = [...conversations].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
            const groups = groupByDate(sorted);
            for (const [label, items] of Object.entries(groups)) {
                if (!items.length) continue;
                const labelEl = document.createElement("div");
                labelEl.className = "sidebar-section-label";
                labelEl.textContent = label;
                sidebarList.appendChild(labelEl);
                for (const c of items) {
                    const item = document.createElement("div");
                    item.className = "conv-item" + (c.id === currentId ? " active" : "");
                    const title = document.createElement("div");
                    title.className = "conv-title";
                    title.textContent = c.title || "New chat";
                    item.appendChild(title);
                    const menu = document.createElement("button");
                    menu.className = "conv-menu";
                    menu.textContent = "⋯";
                    menu.title = "Options";
                    menu.onclick = (e) => { e.stopPropagation(); showConvMenu(e, c.id); };
                    item.appendChild(menu);
                    item.onclick = () => { switchTo(c.id); closeSidebarIfMobile(); };
                    title.ondblclick = (e) => { e.stopPropagation(); renameConversation(c.id); };
                    sidebarList.appendChild(item);
                }
            }
        }

        function switchTo(id) {
            if (streaming) return;
            if (id === currentId) return;
            currentId = id;
            saveData();
            renderAll();
            renderSidebar();
        }

        function renameConversation(id) {
            const c = conversations.find(x => x.id === id);
            if (!c) return;
            const name = prompt("Rename conversation:", c.title || "New chat");
            if (name === null) return;
            c.title = (name.trim() || "New chat").slice(0, 80);
            c.updatedAt = Date.now();
            saveData();
            renderSidebar();
            if (id === currentId) currentTitle.textContent = c.title;
        }

        function deleteConversation(id) {
            const c = conversations.find(x => x.id === id);
            if (!c) return;
            if (!confirm(`Delete "${c.title}"? This cannot be undone.`)) return;
            conversations = conversations.filter(x => x.id !== id);
            if (currentId === id) {
                if (conversations.length) currentId = conversations[0].id;
                else { createConversation(false); currentId = conversations[0].id; }
            }
            saveData();
            renderAll();
            renderSidebar();
        }

        let activeDropdown = null;
        function closeDropdown() {
            if (activeDropdown) { activeDropdown.remove(); activeDropdown = null; }
        }
        function showConvMenu(event, id) {
            closeDropdown();
            const dd = document.createElement("div");
            dd.className = "conv-dropdown";
            const renameBtn = document.createElement("button");
            renameBtn.textContent = "Rename";
            renameBtn.onclick = () => { closeDropdown(); renameConversation(id); };
            dd.appendChild(renameBtn);
            const deleteBtn = document.createElement("button");
            deleteBtn.className = "danger";
            deleteBtn.textContent = "Delete";
            deleteBtn.onclick = () => { closeDropdown(); deleteConversation(id); };
            dd.appendChild(deleteBtn);
            document.body.appendChild(dd);
            const rect = event.target.getBoundingClientRect();
            dd.style.left = Math.min(rect.left, window.innerWidth - 150) + "px";
            dd.style.top = (rect.bottom + 4) + "px";
            activeDropdown = dd;
            setTimeout(() => {
                document.addEventListener("click", function handler(e) {
                    if (!dd.contains(e.target)) {
                        closeDropdown();
                        document.removeEventListener("click", handler);
                    }
                });
            }, 0);
        }

        /* ============================================================
           SIDEBAR OPEN/CLOSE
        ============================================================ */
        function toggleSidebar() {
            sidebar.classList.toggle("open");
            backdrop.classList.toggle("show");
            document.body.classList.toggle("sidebar-open");
            localStorage.setItem("omni_sidebar", sidebar.classList.contains("open") ? "1" : "0");
        }
        function closeSidebar() {
            sidebar.classList.remove("open");
            backdrop.classList.remove("show");
            document.body.classList.remove("sidebar-open");
            localStorage.setItem("omni_sidebar", "0");
        }
        function closeSidebarIfMobile() {
            if (window.innerWidth < 720) closeSidebar();
        }
        if (localStorage.getItem("omni_sidebar") === "1" && window.innerWidth >= 720) {
            sidebar.classList.add("open");
            document.body.classList.add("sidebar-open");
        }

        /* ============================================================
           FOOTER ACTIONS
        ============================================================ */
        function downloadChat() {
            const c = getCurrent();
            if (!c || !c.messages.length) { alert("Nothing to download yet."); return; }
            let content = `${c.title}\n${new Date(c.createdAt).toLocaleString()}\n\n`;
            c.messages.forEach(m => {
                content += `[${m.role === "user" ? "You" : "Omni"}]\n${m.text}\n\n`;
            });
            const blob = new Blob([content], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `omni-${(c.title || "chat").replace(/[^a-z0-9]+/gi, "-").toLowerCase()}-${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }
        function showHelp() {
            alert(
                "How to use Omni:\n\n" +
                "• Type a message and press Enter to send\n" +
                "• Shift+Enter for a new line\n" +
                "• Esc to stop streaming\n" +
                "• Ctrl+K for a new chat\n\n" +
                "Sidebar:\n" +
                "• Click a chat to switch to it\n" +
                "• Double-click a title to rename\n" +
                "• Click ⋯ for rename / delete\n\n" +
                "Message actions (icons below each message):\n" +
                "• Copy — copy the message\n" +
                "• Edit — edit your message\n" +
                "• Regenerate — ask again for a new reply"
            );
        }
        function showAbout() {
            alert("Omni — Your hybrid AI\n\nA modern, streaming AI chatbot.\nBuilt with HTML, CSS, JS, Node.js, DeepSeek, and Gemini.\n\nVersion 1.6");
        }
        function clearData() {
            if (!confirm("This will erase ALL your chats and settings. Continue?")) return;
            localStorage.removeItem("omni_conversations");
            localStorage.removeItem("omni_current_id");
            localStorage.removeItem("omni_history");
            localStorage.removeItem("omni_theme");
            localStorage.removeItem("omni_sidebar");
            location.reload();
        }

        /* ============================================================
           THEME
        ============================================================ */
        function applyTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            document.getElementById("themeIcon").innerHTML = theme === "dark"
                ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>'
                : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
            localStorage.setItem("omni_theme", theme);
        }
        function toggleTheme() {
            const cur = document.documentElement.getAttribute("data-theme") || "light";
            applyTheme(cur === "dark" ? "light" : "dark");
        }
        applyTheme(localStorage.getItem("omni_theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

        function setStatus(state) {
            statusEl.className = "status" + (state === "busy" ? " busy" : state === "error" ? " error" : "");
        }
        function renderBot(text) {
            return marked.parse(text).replace(/<script[\s\S]*?<\/script>/gi, "");
        }

        /* ============================================================
           RENDER MESSAGES
        ============================================================ */
        function buildActions(role, textGetter, opts = {}) {
            const actions = document.createElement("div");
            actions.className = "actions";

            actions.appendChild(makeBtn({
                icon: "copy",
                title: "Copy",
                onClick: (e) => {
                    navigator.clipboard.writeText(textGetter());
                    const btn = e.currentTarget;
                    btn.classList.add("copied");
                    setTimeout(() => btn.classList.remove("copied"), 900);
                }
            }));

            if (role === "bot" && !opts.noRegen) {
                actions.appendChild(makeBtn({
                    icon: "refresh",
                    title: "Regenerate",
                    onClick: () => regenerate()
                }));
            }

            if (role === "user" && typeof opts.index === "number") {
                actions.appendChild(makeBtn({
                    icon: "pencil",
                    title: "Edit",
                    onClick: () => startEdit(opts.block, opts.index)
                }));
            }

            return actions;
        }

        function addMsg(text, role, opts = {}) {
            const block = document.createElement("div");
            block.className = "msg-block " + (role === "user" ? "user" : "bot");
            block.dataset.index = opts.index;

            const div = document.createElement("div");
            div.className = "msg " + (role === "user" ? "user" : "bot");
            if (role === "bot") div.innerHTML = renderBot(text);
            else div.textContent = text;
            block.appendChild(div);

            const actions = buildActions(role, () => div.innerText || div.textContent, {
                index: opts.index,
                noRegen: opts.noRegen,
                block
            });
            block.appendChild(actions);

            chat.appendChild(block);
            chat.scrollTop = chat.scrollHeight;
            return { block, div };
        }

        function addStreamingMsg() {
            const block = document.createElement("div");
            block.className = "msg-block bot";
            const div = document.createElement("div");
            div.className = "msg bot";
            div.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
            block.appendChild(div);
            chat.appendChild(block);
            chat.scrollTop = chat.scrollHeight;
            return { block, div };
        }

        function showWelcome() {
            chat.innerHTML = `
    <div class="welcome">
      <img src="/logo.png" alt="Omni" class="logo-lg-img" onerror="this.src='/favicon.png'">
      <h2>Hi, I'm Omni</h2>
      <p>Ask me anything — I'm here to help.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="useSuggestion('Explain quantum computing in simple terms')">
          <div class="s-title">Explain a concept</div>
          <div class="s-desc">"Quantum computing in simple terms"</div>
        </button>
        <button class="suggestion" onclick="useSuggestion('Write a short poem about the ocean')">
          <div class="s-title">Write something</div>
          <div class="s-desc">"A short poem about the ocean"</div>
        </button>
        <button class="suggestion" onclick="useSuggestion('Help me plan a healthy weekly meal plan')">
          <div class="s-title">Plan something</div>
          <div class="s-desc">"A healthy weekly meal plan"</div>
        </button>
        <button class="suggestion" onclick="useSuggestion('What are the key differences between Python and JavaScript?')">
          <div class="s-title">Compare topics</div>
          <div class="s-desc">"Python vs JavaScript"</div>
        </button>
      </div>
    </div>`;
        }
        function useSuggestion(text) {
            input.value = text;
            input.focus();
            autoResize();
            send();
        }

        function renderAll() {
            const c = getCurrent();
            currentTitle.textContent = c?.title || "Omni";
            if (!c || !c.messages.length) { showWelcome(); return; }
            chat.innerHTML = "";
            c.messages.forEach((m, i) => addMsg(m.text, m.role, { index: i }));
        }

        function setSendState(state) { sendBtn.classList.toggle("stopping", state === "stop"); }
        function handleSendClick() { if (streaming) stopStreaming(); else send(); }
        function stopStreaming() { if (currentController) currentController.abort(); }

        /* ============================================================
           EDIT IN PLACE
        ============================================================ */
        function startEdit(block, index) {
            if (streaming) return;
            const c = getCurrent();
            if (!c) return;
            const m = c.messages[index];
            if (!m || m.role !== "user") return;

            const originalHTML = block.innerHTML;
            const msgDiv = block.querySelector(".msg");
            const actionsDiv = block.querySelector(".actions");

            const editWrap = document.createElement("div");
            editWrap.style.width = "100%";

            const ta = document.createElement("textarea");
            ta.className = "edit-box";
            ta.value = m.text;

            const btns = document.createElement("div");
            btns.className = "edit-actions";

            const cancelBtn = document.createElement("button");
            cancelBtn.className = "cancel-btn";
            cancelBtn.textContent = "Cancel";
            cancelBtn.onclick = () => { block.innerHTML = originalHTML; };

            const saveBtn = document.createElement("button");
            saveBtn.className = "save-btn";
            saveBtn.textContent = "Save";
            saveBtn.onclick = () => {
                const newText = ta.value.trim();
                if (newText) { c.messages[index].text = newText; touchCurrent(); }
                renderAll();
            };

            ta.addEventListener("input", () => {
                ta.style.height = "auto";
                ta.style.height = Math.min(ta.scrollHeight, 200) + "px";
            });
            ta.addEventListener("keydown", e => {
                if (e.key === "Escape") { e.preventDefault(); cancelBtn.click(); }
                if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveBtn.click(); }
            });

            btns.appendChild(cancelBtn);
            btns.appendChild(saveBtn);
            editWrap.appendChild(ta);
            editWrap.appendChild(btns);

            msgDiv.replaceWith(editWrap);
            if (actionsDiv) actionsDiv.style.display = "none";

            ta.focus();
            ta.setSelectionRange(ta.value.length, ta.value.length);
            ta.style.height = "auto";
            ta.style.height = Math.min(ta.scrollHeight, 200) + "px";
        }

        /* ============================================================
           STREAMING SEND
        ============================================================ */
        async function streamReply() {
            currentController = new AbortController();
            const c = getCurrent();
            const res = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: c.messages }),
                signal: currentController.signal
            });
            if (!res.ok || !res.body) {
                const txt = await res.text().catch(() => "");
                throw new Error(txt || `HTTP ${res.status}`);
            }
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let started = false;
            let streamDiv = null;
            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                if (!started && buffer.length > 0) {
                    started = true;
                    const s = addStreamingMsg();
                    streamDiv = s.div;
                }
                fullText += buffer;
                buffer = "";
                if (streamDiv) {
                    streamDiv.innerHTML = renderBot(fullText);
                    chat.scrollTop = chat.scrollHeight;
                }
            }
            if (!started) throw new Error("Empty response");
            return fullText;
        }

        function finalizeStreamedMsg() {
            const last = chat.lastElementChild;
            if (!last || !last.classList.contains("msg-block")) return;
            if (!last.querySelector(".actions")) {
                const finalDiv = last.querySelector(".msg");
                const actions = buildActions("bot", () => finalDiv.innerText);
                last.appendChild(actions);
            }
        }

        async function send() {
            if (streaming) return;
            const text = input.value.trim();
            if (!text) return;

            const c = getCurrent();
            if (!c) { createConversation(true); return send(); }

            if (c.messages.length === 0) chat.innerHTML = "";

            addMsg(text, "user", { index: c.messages.length });
            input.value = "";
            autoResize();
            streaming = true;
            setSendState("stop");
            c.messages.push({ role: "user", text });
            touchCurrent();
            renderSidebar();
            setStatus("busy");

            try {
                const reply = await streamReply();
                c.messages.push({ role: "bot", text: reply });
                touchCurrent();
                renderSidebar();
                finalizeStreamedMsg();
                setStatus("online");
            } catch (err) {
                const last = chat.lastElementChild;
                if (last && last.querySelector(".dots")) last.remove();
                if (err.name === "AbortError") {
                    const pw = chat.lastElementChild;
                    const pd = pw?.querySelector(".msg");
                    const pt = pd?.innerText?.trim() || "";
                    if (pt && pt !== "...") {
                        c.messages.push({ role: "bot", text: pt + "\n\n_(stopped)_" });
                        touchCurrent();
                        renderSidebar();
                        pd.innerHTML = renderBot(pt + "\n\n_(stopped)_");
                        finalizeStreamedMsg();
                    } else pw?.remove();
                    setStatus("online");
                } else {
                    addMsg("Error: " + err.message, "bot", { noRegen: true });
                    setStatus("error");
                    setTimeout(() => setStatus("online"), 3000);
                }
            }
            streaming = false;
            setSendState("send");
            currentController = null;
            input.focus();
        }

        async function regenerate() {
            if (streaming) return;
            const c = getCurrent();
            if (!c || !c.messages.length) return;
            const last = c.messages[c.messages.length - 1];
            if (last.role === "bot") { c.messages.pop(); touchCurrent(); }
            renderAll();
            streaming = true;
            setSendState("stop");
            setStatus("busy");
            try {
                const reply = await streamReply();
                c.messages.push({ role: "bot", text: reply });
                touchCurrent();
                renderSidebar();
                finalizeStreamedMsg();
                setStatus("online");
            } catch (err) {
                if (err.name !== "AbortError") {
                    addMsg("Error: " + err.message, "bot", { noRegen: true });
                    setStatus("error");
                }
            }
            streaming = false;
            setSendState("send");
            currentController = null;
        }

        function newChat(fromSidebar = false) {
            if (streaming) return;
            const c = getCurrent();
            if (c && c.messages.length === 0) {
                input.focus();
                if (fromSidebar) closeSidebarIfMobile();
                return;
            }
            createConversation(true);
            renderAll();
            renderSidebar();
            input.focus();
            if (fromSidebar) closeSidebarIfMobile();
        }

        function autoResize() {
            input.style.height = "auto";
            input.style.height = Math.min(input.scrollHeight, 140) + "px";
        }

        input.addEventListener("input", autoResize);
        input.addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!streaming) send(); }
        });
        input.addEventListener("focus", () => {
            setTimeout(() => {
                chat.scrollTop = chat.scrollHeight;
                input.scrollIntoView({ block: "end", behavior: "smooth" });
            }, 300);
        });

        document.addEventListener("keydown", e => {
            const mod = e.ctrlKey || e.metaKey;
            if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); newChat(); return; }
            if (e.key === "Escape") {
                if (streaming) { e.preventDefault(); stopStreaming(); }
                else if (activeDropdown) { closeDropdown(); }
                else if (sidebar.classList.contains("open")) { e.preventDefault(); closeSidebar(); }
            }
        });

        /* ============================================================
           INIT
        ============================================================ */
        loadData();
        renderSidebar();
        renderAll();
        autoResize();

        if (window.visualViewport) {
            const app = document.querySelector(".app");
            const onResize = () => {
                const vv = window.visualViewport;
                app.style.height = vv.height + "px";
                app.style.top = vv.offsetTop + "px";
                chat.scrollTop = chat.scrollHeight;
            };
            window.visualViewport.addEventListener("resize", onResize);
            window.visualViewport.addEventListener("scroll", onResize);
            onResize();
        }

        window.addEventListener("load", () => {
            const splash = document.getElementById("splash");
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { splash.remove(); return; }
            if (sessionStorage.getItem("splash_shown")) { splash.remove(); return; }
            sessionStorage.setItem("splash_shown", "1");
            setTimeout(() => {
                splash.classList.add("hide");
                setTimeout(() => splash.remove(), 600);
            }, 2400);
        });
    </script>
</body>
