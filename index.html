<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Omni</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Omni">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#7c3aed">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #f7f7f8;
            --panel: #ffffff;
            --border: #e5e5e5;
            --text: #1a1a1a;
            --muted: #8a8a8a;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --user-bg: #7c3aed;
            --user-text: #ffffff;
            --bot-bg: #f1f1f3;
            --bot-text: #1a1a1a;
            --code-bg: #2a2a2a;
            --code-text: #f0f0f0;
            --inline-code-bg: #e5e5e7;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg: #0e0e10;
            --panel: #17171a;
            --border: #26262b;
            --text: #ececec;
            --muted: #8a8a92;
            --accent: #a78bfa;
            --accent-hover: #c4b5fd;
            --user-bg: #7c3aed;
            --user-text: #ffffff;
            --bot-bg: #202024;
            --bot-text: #ececec;
            --code-bg: #0a0a0b;
            --code-text: #f0f0f0;
            --inline-code-bg: #2a2a2f;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }

        .app {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            padding: 0 12px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(8px, env(safe-area-inset-bottom));
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 10px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            display: block;
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }

        .brand h1 {
            font-size: 17px;
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .brand .tag {
            font-size: 11px;
            color: var(--muted);
            margin-top: 1px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            transition: background 0.2s;
        }

        .status.busy {
            background: #eab308;
            animation: pulse 1.2s infinite;
        }

        .status.error {
            background: #ef4444;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .icon-btn {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            width: 34px;
            height: 34px;
            border-radius: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, border-color 0.15s;
        }

        .icon-btn:hover {
            background: var(--bot-bg);
        }

        .icon-btn svg {
            width: 16px;
            height: 16px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding: 8px 0 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .msg-wrap.user {
            align-items: flex-end;
            margin-left: auto;
        }

        .msg-wrap.bot {
            align-items: flex-start;
            margin-right: auto;
        }

        .msg {
            line-height: 1.55;
            font-size: 15px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            animation: fadeIn 0.25s ease-out;
            padding: 11px 15px;
            border-radius: var(--radius);
            max-width: 100%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user {
            background: var(--user-bg);
            color: var(--user-text);
            border-bottom-right-radius: 4px;
            white-space: pre-wrap;
            width: fit-content;
            max-width: 100%;
            margin-left: auto;
        }

        .bot {
            background: var(--bot-bg);
            color: var(--bot-text);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow);
            width: 100%;
        }

        .actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            opacity: 0;
            transition: opacity 0.15s;
            padding: 0 4px;
        }

        .msg-wrap:hover .actions {
            opacity: 1;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 11px;
            padding: 3px 9px;
            border-radius: 6px;
            cursor: pointer;
        }

        .action-btn:hover {
            color: var(--text);
            border-color: var(--muted);
        }

        .bot p {
            margin: 0 0 10px;
        }

        .bot p:last-child {
            margin-bottom: 0;
        }

        .bot ul,
        .bot ol {
            margin: 6px 0 10px 22px;
            padding: 0;
        }

        .bot li {
            margin: 3px 0;
        }

        .bot code {
            background: var(--inline-code-bg);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.88em;
            font-family: "SF Mono", Consolas, Monaco, monospace;
        }

        .bot pre {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 12px 14px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 10px 0;
            font-size: 13px;
        }

        .bot pre code {
            background: none;
            color: inherit;
            padding: 0;
        }

        .bot h1,
        .bot h2,
        .bot h3 {
            margin: 12px 0 8px;
            font-weight: 600;
            line-height: 1.3;
        }

        .bot h1 {
            font-size: 1.2em;
        }

        .bot h2 {
            font-size: 1.1em;
        }

        .bot h3 {
            font-size: 1em;
        }

        .bot a {
            color: var(--accent);
        }

        .bot blockquote {
            border-left: 3px solid var(--border);
            margin: 8px 0;
            padding: 4px 12px;
            color: var(--muted);
        }

        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            padding: 12px;
            animation: fadeIn 0.4s;
        }

        .logo-lg-img {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            display: block;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .welcome h2 {
            font-size: 20px;
            margin: 0 0 6px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .welcome p {
            color: var(--muted);
            font-size: 13px;
            margin: 0 0 22px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            width: 100%;
            max-width: 460px;
        }

        .suggestion {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
        }

        .suggestion:hover,
        .suggestion:active {
            border-color: var(--accent);
            box-shadow: var(--shadow);
        }

        .suggestion .s-title {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .suggestion .s-desc {
            color: var(--muted);
            font-size: 12px;
        }

        .composer-wrap {
            flex-shrink: 0;
            padding-top: 8px;
        }

        .composer {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 8px 8px 14px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            box-shadow: var(--shadow);
            transition: border-color 0.15s;
            width: 100%;
        }

        .composer:focus-within {
            border-color: var(--accent);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 16px;
            line-height: 1.4;
            resize: none;
            outline: none;
            padding: 8px 0;
            max-height: 140px;
            min-height: 22px;
            width: 100%;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, transform 0.1s;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            background: var(--muted);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .send-btn svg {
            width: 17px;
            height: 17px;
        }

        .send-btn .icon-stop {
            display: none;
        }

        .send-btn.stopping {
            background: var(--danger);
        }

        .send-btn.stopping .icon-send {
            display: none;
        }

        .send-btn.stopping .icon-stop {
            display: block;
        }

        .hint {
            text-align: center;
            font-size: 11px;
            color: var(--muted);
            margin-top: 6px;
            padding-bottom: 2px;
        }

        .hint kbd {
            background: var(--bot-bg);
            padding: 1px 5px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 10px;
        }

        .dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            height: 20px;
        }

        .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.2s infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        #splash {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #splash.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-logo {
            width: 88px;
            height: 88px;
            border-radius: 22px;
            box-shadow: var(--shadow);
            animation: splashIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .splash-name {
            font-size: 26px;
            font-weight: 700;
            margin-top: 20px;
            letter-spacing: -0.02em;
            animation: splashIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s both;
        }

        .splash-tag {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
            animation: splashIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s both;
        }

        .splash-dots {
            display: inline-flex;
            gap: 6px;
            margin-top: 32px;
            animation: splashIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s both;
        }

        .splash-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: splashBounce 1.2s infinite;
        }

        .splash-dots span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .splash-dots span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes splashIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes splashBounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.3;
            }

            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        @media (min-width: 720px) {
            .app {
                max-width: 780px;
                margin: 0 auto;
                position: relative;
                height: 100vh;
                height: 100dvh;
            }

            .suggestions {
                grid-template-columns: 1fr 1fr;
            }

            .welcome h2 {
                font-size: 22px;
            }

            .logo-lg-img {
                width: 72px;
                height: 72px;
            }

            #chat {
                padding: 12px 0 20px;
            }

            textarea {
                font-size: 15px;
            }
        }

        @media (max-width: 420px) {
            .brand .tag {
                display: none;
            }

            .brand h1 {
                font-size: 16px;
            }

            .msg-wrap {
                max-width: 92%;
            }
        }
    </style>
</head>

<body>

    <div id="splash">
        <img src="/logo.png" alt="Omni" class="splash-logo" onerror="this.src='/favicon.png'">
        <div class="splash-name">Omni</div>
        <div class="splash-tag">Your hybrid AI</div>
        <div class="splash-dots"><span></span><span></span><span></span></div>
    </div>

    <div class="app">
        <header>
            <div class="brand">
                <img src="/favicon-32x32.png" alt="Omni" class="logo-img">
                <div>
                    <h1>Omni</h1>
                    <div class="tag">Your hybrid AI</div>
                </div>
            </div>
            <div class="header-actions">
                <div class="status" id="status" title="Online"></div>
                <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">
                    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button class="icon-btn" onclick="newChat()" title="New chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
        </header>

        <div id="chat"></div>

        <div class="composer-wrap">
            <div class="composer">
                <textarea id="input" placeholder="Ask Omni anything..." rows="1" autofocus></textarea>
                <button class="send-btn" id="send" onclick="handleSendClick()" title="Send">
                    <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                    <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                    </svg>
                </button>
            </div>
            <div class="hint">
                <kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> newline · <kbd>Esc</kbd> stop
            </div>
        </div>
    </div>

    <script>
        const chat = document.getElementById("chat");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const statusEl = document.getElementById("status");

        let history = JSON.parse(localStorage.getItem("omni_history") || "[]");
        let streaming = false;
        let currentController = null;

        function applyTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            document.getElementById("themeIcon").innerHTML = theme === "dark"
                ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>'
                : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
            localStorage.setItem("omni_theme", theme);
        }
        function toggleTheme() {
            const cur = document.documentElement.getAttribute("data-theme") || "light";
            applyTheme(cur === "dark" ? "light" : "dark");
        }
        applyTheme(localStorage.getItem("omni_theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

        function setStatus(state) {
            statusEl.className = "status" + (state === "busy" ? " busy" : state === "error" ? " error" : "");
        }
        function saveHistory() {
            localStorage.setItem("omni_history", JSON.stringify(history));
        }
        function renderBot(text) {
            return marked.parse(text).replace(/<script[\s\S]*?<\/script>/gi, "");
        }

        function addMsg(text, role, opts = {}) {
            const wrap = document.createElement("div");
            wrap.className = "msg-wrap " + (role === "user" ? "user" : "bot");
            const div = document.createElement("div");
            div.className = "msg " + (role === "user" ? "user" : "bot");
            if (role === "bot") div.innerHTML = renderBot(text);
            else div.textContent = text;
            wrap.appendChild(div);

            const actions = document.createElement("div");
            actions.className = "actions";
            const copyBtn = document.createElement("button");
            copyBtn.className = "action-btn";
            copyBtn.textContent = "Copy";
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(div.innerText || div.textContent);
                copyBtn.textContent = "Copied";
                setTimeout(() => (copyBtn.textContent = "Copy"), 1200);
            };
            actions.appendChild(copyBtn);
            if (role === "bot" && !opts.noRegen) {
                const regen = document.createElement("button");
                regen.className = "action-btn";
                regen.textContent = "Regenerate";
                regen.onclick = () => regenerate();
                actions.appendChild(regen);
            }
            if (role === "user") {
                const edit = document.createElement("button");
                edit.className = "action-btn";
                edit.textContent = "Edit";
                edit.onclick = () => editMessage(opts.index);
                actions.appendChild(edit);
            }
            wrap.appendChild(actions);
            chat.appendChild(wrap);
            chat.scrollTop = chat.scrollHeight;
            return { wrap, div };
        }

        function addStreamingMsg() {
            const wrap = document.createElement("div");
            wrap.className = "msg-wrap bot";
            const div = document.createElement("div");
            div.className = "msg bot";
            div.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
            wrap.appendChild(div);
            chat.appendChild(wrap);
            chat.scrollTop = chat.scrollHeight;
            return { wrap, div };
        }

        function showWelcome() {
            chat.innerHTML = `
    <div class="welcome">
      <img src="/logo.png" alt="Omni" class="logo-lg-img" onerror="this.src='/favicon.png'">
      <h2>Hi, I'm Omni</h2>
      <p>Ask me anything — I'm here to help.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="useSuggestion('Explain quantum computing in simple terms')">
          <div class="s-title">Explain a concept</div>
          <div class="s-desc">"Quantum computing in simple terms"</div>
        </button>
        <button class="suggestion" onclick="useSuggestion('Write a short poem about the ocean')">
          <div class="s-title">Write something</div>
          <div class="s-desc">"A short poem about the ocean"</div>
        </button>
        <button class="suggestion" onclick="useSuggestion('Help me plan a healthy weekly meal plan')">
          <div class="s-title">Plan something</div>
          <div class="s-desc">"A healthy weekly meal plan"</div>
        </button>
        <button class="suggestion" onclick="useSuggestion('What are the key differences between Python and JavaScript?')">
          <div class="s-title">Compare topics</div>
          <div class="s-desc">"Python vs JavaScript"</div>
        </button>
      </div>
    </div>`;
        }
        function useSuggestion(text) {
            input.value = text;
            input.focus();
            autoResize();
            send();
        }
        function renderAll() {
            if (!history.length) { showWelcome(); return; }
            chat.innerHTML = "";
            history.forEach((m, i) => addMsg(m.text, m.role, { index: i }));
        }
        function setSendState(state) {
            sendBtn.classList.toggle("stopping", state === "stop");
        }
        function handleSendClick() {
            if (streaming) stopStreaming(); else send();
        }
        function stopStreaming() {
            if (currentController) currentController.abort();
        }

        async function streamReply() {
            currentController = new AbortController();
            const res = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: history }),
                signal: currentController.signal
            });
            if (!res.ok || !res.body) {
                const txt = await res.text().catch(() => "");
                throw new Error(txt || `HTTP ${res.status}`);
            }
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let started = false;
            let streamDiv = null;
            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                if (!started && buffer.length > 0) {
                    started = true;
                    const s = addStreamingMsg();
                    streamDiv = s.div;
                }
                fullText += buffer;
                buffer = "";
                if (streamDiv) {
                    streamDiv.innerHTML = renderBot(fullText);
                    chat.scrollTop = chat.scrollHeight;
                }
            }
            if (!started) throw new Error("Empty response");
            return fullText;
        }

        function finalizeStreamedMsg() {
            const last = chat.lastElementChild;
            if (!last || !last.classList.contains("msg-wrap")) return;
            if (!last.querySelector(".actions")) {
                const finalDiv = last.querySelector(".msg");
                const actions = document.createElement("div");
                actions.className = "actions";
                const copyBtn = document.createElement("button");
                copyBtn.className = "action-btn";
                copyBtn.textContent = "Copy";
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(finalDiv.innerText);
                    copyBtn.textContent = "Copied";
                    setTimeout(() => (copyBtn.textContent = "Copy"), 1200);
                };
                actions.appendChild(copyBtn);
                const regen = document.createElement("button");
                regen.className = "action-btn";
                regen.textContent = "Regenerate";
                regen.onclick = () => regenerate();
                actions.appendChild(regen);
                last.appendChild(actions);
            }
        }

        async function send() {
            if (streaming) return;
            const text = input.value.trim();
            if (!text) return;
            if (history.length === 0) chat.innerHTML = "";

            addMsg(text, "user", { index: history.length });
            input.value = "";
            autoResize();
            streaming = true;
            setSendState("stop");
            history.push({ role: "user", text });
            saveHistory();
            setStatus("busy");

            try {
                const reply = await streamReply();
                history.push({ role: "bot", text: reply });
                saveHistory();
                finalizeStreamedMsg();
                setStatus("online");
            } catch (err) {
                const last = chat.lastElementChild;
                if (last && last.querySelector(".dots")) last.remove();
                if (err.name === "AbortError") {
                    const pw = chat.lastElementChild;
                    const pd = pw?.querySelector(".msg");
                    const pt = pd?.innerText?.trim() || "";
                    if (pt && pt !== "...") {
                        history.push({ role: "bot", text: pt + "\n\n_(stopped)_" });
                        saveHistory();
                        pd.innerHTML = renderBot(pt + "\n\n_(stopped)_");
                        finalizeStreamedMsg();
                    } else pw?.remove();
                    setStatus("online");
                } else {
                    addMsg("Error: " + err.message, "bot", { noRegen: true });
                    setStatus("error");
                    setTimeout(() => setStatus("online"), 3000);
                }
            }
            streaming = false;
            setSendState("send");
            currentController = null;
            input.focus();
        }

        async function regenerate() {
            if (streaming || !history.length) return;
            const last = history[history.length - 1];
            if (last.role === "bot") { history.pop(); saveHistory(); }
            renderAll();
            streaming = true;
            setSendState("stop");
            setStatus("busy");
            try {
                const reply = await streamReply();
                history.push({ role: "bot", text: reply });
                saveHistory();
                finalizeStreamedMsg();
                setStatus("online");
            } catch (err) {
                if (err.name !== "AbortError") {
                    addMsg("Error: " + err.message, "bot", { noRegen: true });
                    setStatus("error");
                }
            }
            streaming = false;
            setSendState("send");
            currentController = null;
        }

        function editMessage(index) {
            if (typeof index !== "number") return;
            const m = history[index];
            if (!m || m.role !== "user") return;
            input.value = m.text;
            input.focus();
            autoResize();
            history = history.slice(0, index);
            saveHistory();
            renderAll();
        }
        function newChat() {
            if (streaming) return;
            if (history.length && !confirm("Clear this conversation?")) return;
            history = [];
            saveHistory();
            showWelcome();
            input.focus();
        }
        function autoResize() {
            input.style.height = "auto";
            input.style.height = Math.min(input.scrollHeight, 140) + "px";
        }

        input.addEventListener("input", autoResize);
        input.addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                if (!streaming) send();
            }
        });

        input.addEventListener("focus", () => {
            setTimeout(() => {
                chat.scrollTop = chat.scrollHeight;
                input.scrollIntoView({ block: "end", behavior: "smooth" });
            }, 300);
        });

        document.addEventListener("keydown", e => {
            const mod = e.ctrlKey || e.metaKey;
            if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); newChat(); return; }
            if (e.key === "Escape" && streaming) { e.preventDefault(); stopStreaming(); }
        });

        renderAll();
        autoResize();

        if (window.visualViewport) {
            const app = document.querySelector(".app");
            const onResize = () => {
                const vv = window.visualViewport;
                app.style.height = vv.height + "px";
                app.style.top = vv.offsetTop + "px";
                chat.scrollTop = chat.scrollHeight;
            };
            window.visualViewport.addEventListener("resize", onResize);
            window.visualViewport.addEventListener("scroll", onResize);
            onResize();
        }

        window.addEventListener("load", () => {
            const splash = document.getElementById("splash");
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { splash.remove(); return; }
            if (sessionStorage.getItem("splash_shown")) { splash.remove(); return; }
            sessionStorage.setItem("splash_shown", "1");
            setTimeout(() => {
                splash.classList.add("hide");
                setTimeout(() => splash.remove(), 600);
            }, 1200);
        });
    </script>
</body>

</html>
