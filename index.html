<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Omni</title>

    <!-- Favicons (browser tabs) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- Apple (iPhone / iPad home screen) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Omni">

    <!-- Android / PWA -->
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#7c3aed">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #f7f7f8;
            --panel: #ffffff;
            --border: #e5e5e5;
            --text: #1a1a1a;
            --muted: #8a8a8a;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --user-bg: #7c3aed;
            --user-text: #ffffff;
            --bot-bg: #f1f1f3;
            --bot-text: #1a1a1a;
            --code-bg: #2a2a2a;
            --code-text: #f0f0f0;
            --inline-code-bg: #e5e5e7;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg: #0e0e10;
            --panel: #17171a;
            --border: #26262b;
            --text: #ececec;
            --muted: #8a8a92;
            --accent: #a78bfa;
            --accent-hover: #c4b5fd;
            --user-bg: #7c3aed;
            --user-text: #ffffff;
            --bot-bg: #202024;
            --bot-text: #ececec;
            --code-bg: #0a0a0b;
            --code-text: #f0f0f0;
            --inline-code-bg: #2a2a2f;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 24px 16px;
            transition: background 0.2s, color 0.2s;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            width: 100%;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 48px);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            display: block;
            box-shadow: var(--shadow);
        }

        .brand h1 {
            font-size: 17px;
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .brand .tag {
            font-size: 11px;
            color: var(--muted);
            margin-top: 1px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            transition: background 0.2s;
        }

        .status.busy {
            background: #eab308;
            animation: pulse 1.2s infinite;
        }

        .status.error {
            background: #ef4444;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .icon-btn {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            width: 34px;
            height: 34px;
            border-radius: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, border-color 0.15s;
        }

        .icon-btn:hover {
            background: var(--bot-bg);
        }

        .icon-btn svg {
            width: 16px;
            height: 16px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px 6px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .msg {
            max-width: 85%;
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease-out;
            padding: 12px 16px;
            border-radius: var(--radius);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user {
            background: var(--user-bg);
            color: var(--user-text);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            white-space: pre-wrap;
        }

        .bot {
            background: var(--bot-bg);
            color: var(--bot-text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow);
        }

        .msg-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .msg-wrap.user {
            align-items: flex-end;
        }

        .msg-wrap.bot {
            align-items: flex-start;
        }

        .actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            opacity: 0;
            transition: opacity 0.15s;
            padding: 0 4px;
        }

        .msg-wrap:hover .actions {
            opacity: 1;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 11px;
            padding: 3px 9px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .action-btn:hover {
            color: var(--text);
            border-color: var(--muted);
        }

        .bot p {
            margin: 0 0 10px;
        }

        .bot p:last-child {
            margin-bottom: 0;
        }

        .bot ul,
        .bot ol {
            margin: 6px 0 10px 22px;
            padding: 0;
        }

        .bot li {
            margin: 3px 0;
        }

        .bot code {
            background: var(--inline-code-bg);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.88em;
            font-family: "SF Mono", Consolas, Monaco, monospace;
        }

        .bot pre {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 12px 14px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 10px 0;
            font-size: 13px;
        }

        .bot pre code {
            background: none;
            color: inherit;
            padding: 0;
        }

        .bot h1,
        .bot h2,
        .bot h3 {
            margin: 12px 0 8px;
            font-weight: 600;
            line-height: 1.3;
        }

        .bot h1 {
            font-size: 1.2em;
        }

        .bot h2 {
            font-size: 1.1em;
        }

        .bot h3 {
            font-size: 1em;
        }

        .bot a {
            color: var(--accent);
        }

        .bot blockquote {
            border-left: 3px solid var(--border);
            margin: 8px 0;
            padding: 4px 12px;
            color: var(--muted);
        }

        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            padding: 20px;
            animation: fadeIn 0.4s;
        }

        .logo-lg-img {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            display: block;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .welcome h2 {
            font-size: 22px;
            margin: 0 0 6px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .welcome p {
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 28px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }

        .suggestion {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text);
            font-size: 13px;
            line-height: 1.4;
        }

        .suggestion:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .suggestion .s-title {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .suggestion .s-desc {
            color: var(--muted);
            font-size: 12px;
        }

        .composer {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 10px 10px 10px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            box-shadow: var(--shadow);
            transition: border-color 0.15s;
        }

        .composer:focus-within {
            border-color: var(--accent);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            outline: none;
            padding: 8px 0;
            max-height: 180px;
            min-height: 24px;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.1s;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            background: var(--muted);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .send-btn svg {
            width: 17px;
            height: 17px;
        }

        .hint {
            text-align: center;
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
            padding-bottom: 4px;
        }

        .hint kbd {
            background: var(--bot-bg);
            padding: 1px 5px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 10px;
        }

        .dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            height: 20px;
        }

        .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.2s infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        #chat::-webkit-scrollbar {
            width: 8px;
        }

        #chat::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        #chat::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        @media (max-width: 640px) {
            body {
                padding: 12px 10px;
            }

            .app {
                height: calc(100vh - 24px);
            }

            .msg {
                max-width: 92%;
                font-size: 14.5px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .welcome h2 {
                font-size: 19px;
            }

            .brand h1 {
                font-size: 16px;
            }

            .logo-img {
                width: 28px;
                height: 28px;
            }

            .logo-lg-img {
                width: 60px;
                height: 60px;
            }

            header {
                padding-bottom: 10px;
            }
        }

        /* Splash screen */
        #splash {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #splash.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-logo {
            width: 96px;
            height: 96px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            animation: splashIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .splash-name {
            font-size: 28px;
            font-weight: 700;
            margin-top: 24px;
            letter-spacing: -0.02em;
            animation: splashIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s both;
        }

        .splash-tag {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
            animation: splashIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s both;
        }

        .splash-dots {
            display: inline-flex;
            gap: 6px;
            margin-top: 40px;
            animation: splashIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s both;
        }

        .splash-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: splashBounce 1.2s infinite;
        }

        .splash-dots span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .splash-dots span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes splashIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes splashBounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.3;
            }

            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 12px 8px;
                overflow-x: hidden;
            }

            .app {
                height: calc(100vh - 24px);
                height: calc(100dvh - 24px);
                /* better on mobile browsers with URL bars */
                max-width: 100%;
                overflow-x: hidden;
            }

            header {
                padding: 0 4px 10px;
                flex-wrap: nowrap;
            }

            .brand {
                min-width: 0;
                flex: 1;
            }

            .brand h1 {
                font-size: 16px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .brand .tag {
                display: none;
                /* hide subtitle on small screens */
            }

            .header-actions {
                flex-shrink: 0;
            }

            .msg-wrap {
                max-width: 90%;
            }

            .suggestions {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .suggestion {
                padding: 12px;
            }

            .welcome {
                padding: 12px;
            }

            .welcome h2 {
                font-size: 18px;
            }

            .welcome p {
                font-size: 13px;
                margin-bottom: 20px;
            }

            .logo-lg-img {
                width: 56px;
                height: 56px;
                margin-bottom: 14px;
            }

            .composer {
                padding: 8px 8px 8px 14px;
            }

            textarea {
                font-size: 16px;
                /* prevents iOS auto-zoom on focus */
            }

            .hint {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Splash screen -->
    <div id="splash">
        <img src="/logo.png" alt="Omni" class="splash-logo" onerror="this.src='/favicon.png'">
        <div class="splash-name">Omni</div>
        <div class="splash-tag">Your hybrid AI</div>
        <div class="splash-dots"><span></span><span></span><span></span></div>
    </div>

    <div class="app">
        <header>
            <div class="brand">
                <img src="/favicon-32x32.png" alt="Omni" class="logo-img">
                <div>
                    <h1>Omni</h1>
                    <div class="tag">Your hybrid AI</div>
                </div>
            </div>
            <div class="header-actions">
                <div class="status" id="status" title="Online"></div>
                <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">
                    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button class="icon-btn" onclick="newChat()" title="New chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
        </header>

        <div id="chat"></div>

        <div class="composer">
            <textarea id="input" placeholder="Ask Omni anything..." rows="1" autofocus></textarea>
            <button class="send-btn" id="send" onclick="send()" title="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>
        </div>
        <div class="hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for newline</div>
    </div>

    <script>
        const chat = document.getElementById("chat");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const statusEl = document.getElementById("status");

        let history = JSON.parse(localStorage.getItem("omni_history") || "[]");
        let streaming = false;

        /* Theme */
        function applyTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            document.getElementById("themeIcon").innerHTML = theme === "dark"
                ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>'
                : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
            localStorage.setItem("omni_theme", theme);
        }
        function toggleTheme() {
            const cur = document.documentElement.getAttribute("data-theme") || "light";
            applyTheme(cur === "dark" ? "light" : "dark");
        }
        applyTheme(localStorage.getItem("omni_theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

        function setStatus(state) {
            statusEl.className = "status" + (state === "busy" ? " busy" : state === "error" ? " error" : "");
            statusEl.title = state === "busy" ? "Thinking..." : state === "error" ? "Error" : "Online";
        }

        function saveHistory() {
            localStorage.setItem("omni_history", JSON.stringify(history));
        }

        function renderBot(text) {
            const raw = marked.parse(text);
            return raw.replace(/<script[\s\S]*?<\/script>/gi, "");
        }

        /* Message rendering */
        function addMsg(text, role, opts = {}) {
            const wrap = document.createElement("div");
            wrap.className = "msg-wrap " + (role === "user" ? "user" : "bot");

            const div = document.createElement("div");
            div.className = "msg " + (role === "user" ? "user" : "bot");
            if (role === "bot") div.innerHTML = renderBot(text);
            else div.textContent = text;

            wrap.appendChild(div);

            const actions = document.createElement("div");
            actions.className = "actions";

            const copyBtn = document.createElement("button");
            copyBtn.className = "action-btn";
            copyBtn.textContent = "Copy";
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(div.innerText || div.textContent);
                copyBtn.textContent = "Copied";
                setTimeout(() => (copyBtn.textContent = "Copy"), 1200);
            };
            actions.appendChild(copyBtn);

            if (role === "bot" && !opts.noRegen) {
                const regen = document.createElement("button");
                regen.className = "action-btn";
                regen.textContent = "Regenerate";
                regen.onclick = () => regenerate();
                actions.appendChild(regen);
            }

            if (role === "user") {
                const edit = document.createElement("button");
                edit.className = "action-btn";
                edit.textContent = "Edit";
                edit.onclick = () => editMessage(opts.index);
                actions.appendChild(edit);
            }

            wrap.appendChild(actions);
            chat.appendChild(wrap);
            chat.scrollTop = chat.scrollHeight;
            return { wrap, div };
        }

        function addStreamingMsg() {
            const wrap = document.createElement("div");
            wrap.className = "msg-wrap bot";
            const div = document.createElement("div");
            div.className = "msg bot";
            div.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
            wrap.appendChild(div);
            chat.appendChild(wrap);
            chat.scrollTop = chat.scrollHeight;
            return { wrap, div };
        }

        function showWelcome() {
            chat.innerHTML = `
    <div class="welcome">
      <img src="/logo.png" alt="Omni" class="logo-lg-img" onerror="this.src='/favicon.png'">
      <h2>Hi, I'm Omni</h2>
      <p>Ask me anything — I'm here to help.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="useSuggestion('Explain quantum computing in simple terms')">
          <div class="s-title">Explain a concept</div>
          <div class="s-desc">"Quantum computing in simple terms"</div>
        </button>
        <button class="suggestion" onclick="useSuggestion('Write a short poem about the ocean')">
          <div class="s-title">Write something</div>
          <div class="s-desc">"A short poem about the ocean"</div>
        </button>
        <button class="suggestion" onclick="useSuggestion('Help me plan a healthy weekly meal plan')">
          <div class="s-title">Plan something</div>
          <div class="s-desc">"A healthy weekly meal plan"</div>
        </button>
        <button class="suggestion" onclick="useSuggestion('What are the key differences between Python and JavaScript?')">
          <div class="s-title">Compare topics</div>
          <div class="s-desc">"Python vs JavaScript"</div>
        </button>
      </div>
    </div>`;
        }

        function useSuggestion(text) {
            input.value = text;
            input.focus();
            autoResize();
            send();
        }

        function renderAll() {
            if (!history.length) { showWelcome(); return; }
            chat.innerHTML = "";
            history.forEach((m, i) => addMsg(m.text, m.role, { index: i }));
        }

        /* Core streaming send */
        async function streamReply() {
            const res = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: history })
            });

            if (!res.ok || !res.body) {
                const txt = await res.text().catch(() => "");
                throw new Error(txt || `HTTP ${res.status}`);
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let started = false;
            let streamDiv = null;
            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });

                if (!started && buffer.length > 0) {
                    started = true;
                    const s = addStreamingMsg();
                    streamDiv = s.div;
                }

                fullText += buffer;
                buffer = "";

                if (streamDiv) {
                    streamDiv.innerHTML = renderBot(fullText);
                    chat.scrollTop = chat.scrollHeight;
                }
            }

            if (!started) throw new Error("Empty response");
            return fullText;
        }

        async function send() {
            if (streaming) return;
            const text = input.value.trim();
            if (!text) return;

            if (history.length === 0) chat.innerHTML = "";

            addMsg(text, "user", { index: history.length });
            input.value = "";
            autoResize();
            sendBtn.disabled = true;
            streaming = true;

            history.push({ role: "user", text });
            saveHistory();

            setStatus("busy");

            try {
                const reply = await streamReply();
                history.push({ role: "bot", text: reply });
                saveHistory();

                const last = chat.lastElementChild;
                if (last && last.classList.contains("msg-wrap") && !last.querySelector(".actions")) {
                    const finalDiv = last.querySelector(".msg");
                    const actions = document.createElement("div");
                    actions.className = "actions";

                    const copyBtn = document.createElement("button");
                    copyBtn.className = "action-btn";
                    copyBtn.textContent = "Copy";
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(finalDiv.innerText);
                        copyBtn.textContent = "Copied";
                        setTimeout(() => (copyBtn.textContent = "Copy"), 1200);
                    };
                    actions.appendChild(copyBtn);

                    const regen = document.createElement("button");
                    regen.className = "action-btn";
                    regen.textContent = "Regenerate";
                    regen.onclick = () => regenerate();
                    actions.appendChild(regen);

                    last.appendChild(actions);
                }
                setStatus("online");
            } catch (err) {
                const last = chat.lastElementChild;
                if (last && last.querySelector(".dots")) last.remove();
                addMsg("Error: " + err.message, "bot", { noRegen: true });
                setStatus("error");
                setTimeout(() => setStatus("online"), 3000);
            }

            sendBtn.disabled = false;
            streaming = false;
            input.focus();
        }

        async function regenerate() {
            if (streaming || !history.length) return;
            const last = history[history.length - 1];
            if (last.role === "bot") {
                history.pop();
                saveHistory();
            }
            renderAll();
            sendBtn.disabled = true;
            streaming = true;
            setStatus("busy");
            try {
                const reply = await streamReply();
                history.push({ role: "bot", text: reply });
                saveHistory();
                setStatus("online");
            } catch (err) {
                addMsg("Error: " + err.message, "bot", { noRegen: true });
                setStatus("error");
            }
            sendBtn.disabled = false;
            streaming = false;
        }

        function editMessage(index) {
            if (typeof index !== "number") return;
            const m = history[index];
            if (!m || m.role !== "user") return;
            input.value = m.text;
            input.focus();
            autoResize();
            history = history.slice(0, index);
            saveHistory();
            renderAll();
        }

        function newChat() {
            if (history.length && !confirm("Clear this conversation?")) return;
            history = [];
            saveHistory();
            showWelcome();
            input.focus();
        }

        /* Input */
        function autoResize() {
            input.style.height = "auto";
            input.style.height = Math.min(input.scrollHeight, 180) + "px";
        }

        input.addEventListener("input", autoResize);
        input.addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        renderAll();
        autoResize();

        /* Splash screen */
        window.addEventListener("load", () => {
            const splash = document.getElementById("splash");

            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                splash.remove();
                return;
            }

            if (sessionStorage.getItem("splash_shown")) {
                splash.remove();
                return;
            }
            sessionStorage.setItem("splash_shown", "1");

            setTimeout(() => {
                splash.classList.add("hide");
                setTimeout(() => splash.remove(), 600);
            }, 1200);
        });
        // Fix keyboard covering input on mobile
        if (window.visualViewport) {
            const app = document.querySelector(".app");

            const updateViewport = () => {
                const vh = window.visualViewport.height;
                app.style.height = vh + "px";
                // Scroll to bottom so input stays visible
                chat.scrollTop = chat.scrollHeight;
            };

            window.visualViewport.addEventListener("resize", updateViewport);
            window.visualViewport.addEventListener("scroll", updateViewport);
        }
    </script>
</body>

</html>
